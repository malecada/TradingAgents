name: Research offline verification

on:
  push:
    branches: [main, 'chore/research-readiness-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      RUN_ONLINE_TESTS: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.7'
          enable-cache: false
      - name: Install the unchanged locked research environment
        run: uv sync --locked --all-extras --python 3.13.13
      - name: Verify interpreter, import origin and lock
        run: .venv/bin/python -B scripts/research_runtime.py --check
      - name: Run reviewed offline engineering and checker tests
        run: .venv/bin/python -B scripts/verify_offline.py
